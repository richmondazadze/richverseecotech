<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfbf9" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Fonts are self-hosted (see @font-face in index.css). Preload only the
         two hero/LCP faces so the headline paints with zero swap flash. -->
    <link rel="preload" href="/fonts/playfair-display-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-display-400-italic.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Without JS the scroll-reveal content stays hidden; force it visible. -->
    <noscript><style>.reveal{opacity:1 !important;transform:none !important}</style></noscript>
    <!-- Per-route title, meta, canonical, Open Graph & JSON-LD are injected here at build time (prerender.js) and managed by react-helmet-async on the client. -->
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
